<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Vice City 6 Engine Architecture</title>
  <desc id="arch-desc">Pipeline diagram of the zero-asset Three.js game engine from procedural generation to 60Hz simulation and WebGL rendering.</desc>

  <defs>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#01cdfe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05ffa1" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14172b"/>
      <stop offset="100%" stop-color="#0c0e1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="#090a12" stroke="#1a1c2e" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <text x="0" y="0" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE</text>
    <text x="0" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Zero-Asset Runtime Pipeline</text>
    <text x="320" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">No network requests, no 3D asset downloads, 100% generated in memory</text>
  </g>

  <!-- Pipeline Steps (4 columns) -->

  <!-- Column 1: Generation -->
  <g transform="translate(48, 90)">
    <rect width="250" height="190" rx="10" fill="url(#box-bg)" stroke="#222538" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="3" fill="#ff2a85" rx="1.5"/>
    <text x="18" y="28" fill="#ff71ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">01 / PROCEDURAL GEN</text>
    <text x="18" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Seeded Synthesis</text>
    
    <text x="18" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• OffscreenCanvas textures</text>
    <text x="18" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Assembled primitives</text>
    <text x="18" y="128" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Web Audio synths (FM/Noise)</text>
    <text x="18" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• 6x6 Deterministic layout</text>
    <text x="18" y="174" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Seed: rngFrom('vice6')</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(306, 175)">
    <path d="M 0 0 L 22 0 M 14 -5 L 22 0 L 14 5" stroke="#ff2a85" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Column 2: 60Hz Simulation -->
  <g transform="translate(336, 90)">
    <rect width="250" height="190" rx="10" fill="url(#box-bg)" stroke="#222538" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="3" fill="#01cdfe" rx="1.5"/>
    <text x="18" y="28" fill="#01cdfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">02 / SIMULATION (60HZ)</text>
    <text x="18" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Physics &amp; World AI</text>
    
    <text x="18" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Vehicle arcade dynamics</text>
    <text x="18" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Pavement pedestrian loop</text>
    <text x="18" y="128" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Road graph traffic AI</text>
    <text x="18" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• 5-Star heat dispatch</text>
    <text x="18" y="174" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Fixed 16.6ms timestep</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(594, 175)">
    <path d="M 0 0 L 22 0 M 14 -5 L 22 0 L 14 5" stroke="#01cdfe" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Column 3: Optimization & Graph -->
  <g transform="translate(624, 90)">
    <rect width="250" height="190" rx="10" fill="url(#box-bg)" stroke="#222538" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="3" fill="#ffbd2e" rx="1.5"/>
    <text x="18" y="28" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">03 / SCENE OPTIMIZATION</text>
    <text x="18" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">Batching &amp; Geometry</text>
    
    <text x="18" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Merged static buffers</text>
    <text x="18" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• InstancedMesh props</text>
    <text x="18" y="128" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Dynamic day/night sun</text>
    <text x="18" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Emissive night lighting</text>
    <text x="18" y="174" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">Budget: ~250 draw calls</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(882, 175)">
    <path d="M 0 0 L 22 0 M 14 -5 L 22 0 L 14 5" stroke="#ffbd2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Column 4: Browser Target -->
  <g transform="translate(912, 90)">
    <rect width="240" height="190" rx="10" fill="url(#box-bg)" stroke="#222538" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="3" fill="#05ffa1" rx="1.5"/>
    <text x="18" y="28" fill="#05ffa1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">04 / BROWSER OUTPUT</text>
    <text x="18" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700">60 FPS Hardware</text>
    
    <text x="18" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• WebGL single canvas</text>
    <text x="18" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Web Audio API output</text>
    <text x="18" y="128" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Zero binary downloads</text>
    <text x="18" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">• Touch &amp; keyboard/mouse</text>
    <text x="18" y="174" fill="#05ffa1" font-family="ui-monospace, monospace" font-size="11">Works fully offline</text>
  </g>
</svg>
